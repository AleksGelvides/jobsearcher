name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      # Match @playwright/test and the environment used for the Linux baselines.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Build frontend
        run: npm run build

      - name: Run unit tests with coverage
        run: npm test

      - name: Run end-to-end and visual tests
        id: playwright
        run: npm run test:e2e -- --update-snapshots=none

      - name: Upload Playwright failure artifacts
        if: ${{ failure() && steps.playwright.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure
          path: frontend/test-results/
          if-no-files-found: ignore

  docker-build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend Docker image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/jobpilot-frontend:latest
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker build --tag "$IMAGE_NAME" ./frontend

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/jobpilot-frontend:latest
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          docker push "$IMAGE_NAME"
