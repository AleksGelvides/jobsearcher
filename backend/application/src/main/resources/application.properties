spring.application.name=application

jobpilot.auth.issuer=${JOBPILOT_OIDC_ISSUER:http://localhost:8155/realms/jobpilot}
jobpilot.auth.internal-issuer=${JOBPILOT_OIDC_INTERNAL_ISSUER:${jobpilot.auth.issuer}}
jobpilot.auth.callback=${JOBPILOT_OIDC_CALLBACK:http://localhost:5173/login/oauth2/code/keycloak}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${JOBPILOT_SECURE_SESSION_COOKIE:false}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobsearcher}
spring.datasource.username=jobsearcher
spring.datasource.password=jobsearcher_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
