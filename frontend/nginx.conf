server {
    listen 5173;
    listen [::]:5173;
    server_name _;
    root /usr/share/nginx/html;

    location ~ ^/(login(/oauth2/code/keycloak)?|oauth2/authorization/keycloak)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jobpilot_backend http://backend:8080;
        proxy_pass $jobpilot_backend;
        proxy_set_header Host $http_host;
        access_log off;
    }

    location /api/v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jobpilot_backend http://backend:8080;
        client_max_body_size 11m;
        proxy_pass $jobpilot_backend;
        proxy_set_header Host $http_host;
    }

    location = /healthz {
        access_log off;
        return 204;
    }

    location = /__jobpilot/session {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $jobpilot_backend http://backend:8080;
        proxy_pass $jobpilot_backend;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        access_log off;
    }

    location ~ ^/(index\.html)?$ {
        auth_request /__jobpilot/session;
        error_page 401 = @login;
        try_files /index.html =404;
    }

    location @login {
        absolute_redirect off;
        return 302 /login;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
